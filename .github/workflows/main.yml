---
# Main CI
#
# Perform lint, sanity checks and unit tests without access to a physical
# device.
# Triggered by:
#   - push to main and feature/**
#   - pull_request including forked repositories
#   - manual dispatch
#
# On push or manual dispatch to main:
# - integration-test runs module tests against hardware devices to validate
#   changes post-merge to main.

name: Main CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

# Use concurrency group so main CI runs once for both push trigger and
# PR synchronisation. Pushes to main queue instead of cancelling, since
# each one is permanent history and integration-test may be mid-run
# against the real device - only non-main branches cancel superseded runs.
concurrency:
  group: main-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  integration-test:
    name: Integration Tests (main)
    needs: [checks]
    runs-on: [self-hosted, ansible, integration-tests]
    # Perform integration tests automatically on merge to main as changes are
    # reviewed and manually approved pre-merge for all PRs.
    environment: integration-tests
    # Use concurrency group to serialise access to integration-test devices
    concurrency:
      group: integration-tests-device
      cancel-in-progress: false
    # Perform integration tests on upstream main only
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ) &&
      github.repository == 'opengear/ansible-ng' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inventory
        run: |
          cat > inventory.networking << EOF
          [opengear]
          test-om ansible_host=${{ secrets.OM2200_DEVICE_HOST }} \
                  ansible_user=${{ secrets.OM2200_DEVICE_USER }} \
                  ansible_password=${{ secrets.OM2200_DEVICE_PASSWORD }}
          [opengear:vars]
          ansible_connection=httpapi
          ansible_network_os=opengear.ng.http_api
          ansible_httpapi_use_ssl=true
          ansible_httpapi_validate_certs=false
          EOF

      - name: Run integration tests
        uses: ./.github/actions/integration-test
        with:
          python-version: "3.11"
          inventory-file: inventory.networking

      - name: Cleanup inventory
        if: always()
        shell: bash
        run: rm -f inventory.networking
