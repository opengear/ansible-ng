---
# Main CI
#
# Perform lint, sanity checks and unit tests without access to a physical
# device.
# Triggered by:
#   - push to main, release/** and feature/**
#   - pull_request including forked repositories
#   - manual dispatch
#
# On push or manual dispatch of release/** branch:
# - release-readiness confirms the collection builds, has version incremented
#   from main, and that generated release notes are included.
#
# On push or manual-dispatch to main:
# - integration-test runs module tests against hardware devices to validate
#   changes post-merge to main.
# - detect-increment checks the version has been incremented from the previous
#   commit on main to determine if a release should begin.
# - start-release then dispatches the Release workflow only if both
#   integration-test and detect-increment have succeeded.

name: Main CI

on:
  push:
    branches:
      - main
      - feature/**
      - release/**
  pull_request:
  workflow_dispatch:

# Use concurrency group so main CI runs once for both push trigger and
# PR synchronisation. Pushes to main queue instead of cancelling, since
# each one is permanent history and integration-test may be mid-run
# against the real device - only non-main branches cancel superseded runs.
concurrency:
  group: main-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run lint checks
        uses: ./.github/actions/lint
        with:
          python-version: "3.11"

  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
    name: "Sanity: python ${{ matrix.python }}"
    steps:
      - uses: actions/checkout@v4
      - name: Run sanity check
        uses: ./.github/actions/sanity
        with:
          python-version: ${{ matrix.python }}

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
    name: "Unit Tests: python ${{ matrix.python }}"
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        uses: ./.github/actions/unit-test
        with:
          python-version: ${{ matrix.python }}

  integration-test:
    name: Integration Tests
    needs: [lint, sanity, unit-test]
    runs-on: [self-hosted, ansible, integration-tests]
    # Perform integration tests automatically on merge to main as changes are
    # reviewed and manually approved pre-merge for all PRs.
    environment: integration-tests-main
    # Use concurrency group to serialise access to integration-test devices
    concurrency:
      group: integration-tests-device
      cancel-in-progress: false
    # Perform integration tests on upstream main only
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ) &&
      github.repository == 'opengear/ansible-ng' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inventory
        run: |
          cat > inventory.networking << EOF
          [opengear]
          test-om ansible_host=${{ secrets.OM2200_DEVICE_HOST }} \
                  ansible_user=${{ secrets.OM2200_DEVICE_USER }} \
                  ansible_password=${{ secrets.OM2200_DEVICE_PASSWORD }}
          [opengear:vars]
          ansible_connection=httpapi
          ansible_network_os=opengear.ng.http_api
          ansible_httpapi_use_ssl=true
          ansible_httpapi_validate_certs=false
          EOF

      - name: Run integration tests
        uses: ./.github/actions/integration-test
        with:
          python-version: "3.11"
          inventory-file: inventory.networking

      - name: Cleanup inventory
        if: always()
        shell: bash
        run: rm -f inventory.networking

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    # Only runs on release branches, whether pushed to or manually dispatched
    if: |
      startsWith(github.ref, 'refs/heads/release/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a version increment
        uses: ./.github/actions/version-check

      - name: Build collection
        uses: ./.github/actions/build-collection

      - name: Check release notes were generated
        uses: ./.github/actions/changelog-check

  detect-increment:
    name: Detect version increment
    runs-on: ubuntu-latest
    # Detemine if the version of main has been incremented following merge
    # of release branch.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ) &&
      github.repository == 'opengear/ansible-ng' &&
      github.ref == 'refs/heads/main'
    outputs:
      incremented: ${{ steps.version.outputs.incremented }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a version increment
        id: version
        uses: ./.github/actions/version-check
        with:
          base-ref: ${{ github.event.before }}
          # Detect a version change without enforcement
          require-increment: 'false'

  start-release:
    name: Start release
    needs: [detect-increment, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    # Only if detect-increment determines the version is increased
    # and integration-test succeeded.
    if: |
      needs.detect-increment.outputs.incremented == 'true' &&
      needs.integration-test.result == 'success'
    steps:
      - name: Dispatch the release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version="${{ needs.detect-increment.outputs.version }}" \
            -f sha="${{ github.sha }}"
