---
ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: "First release of the ``opengear.ng`` collection, providing\
        \ Ansible modules\nfor managing Opengear devices.\n\nTested against Opengear\
        \ device firmware 25.11.9.\n\nHighlights of this release:\n\n* **Configuration\
        \ management** - ``config_export`` exports the device\n  configuration, ``config_diff``\
        \ previews how a provided configuration\n  differs from the running one, ``config_import``\
        \ merges a configuration\n  into the device, and ``config_restore`` restores\
        \ a previously exported\n  configuration.\n* **Security** - ``local_password_policy``\
        \ manages the expiry and\n  complexity policy for local user passwords.\n\
        * **Firmware** - ``system_firmware_upgrade`` manages firmware upgrades.\n\
        * **Serial ports** - ``ports_config``, ``ports_status``, ``ports_control``,\n\
        \  ``ports_sessions`` and ``ports_auto_discover`` configure ports, report\n\
        \  live status, send control actions, manage active sessions and manage\n\
        \  port auto-discovery.\n* **PDUs** - ``pdu_config``, ``pdu_status`` and ``pdu_control``\
        \ configure\n  connected PDUs, report PDU and outlet status, and send outlet\
        \ power\n  actions.\n* **Networking** - ``conns``, ``physifs``, ``static_routes``\
        \ and\n  ``failover`` manage network connections, physical interfaces, static\n\
        \  routes and failover behaviour.\n* **Users and access** - ``users``, ``groups``,\
        \ ``auth``,\n  ``users_authorized_keys`` and ``system_authorized_keys`` manage\
        \ users,\n  groups, authentication and SSH authorized keys.\n* **Services\
        \ and system** - ``services_config``, ``services_syslog``,\n  ``services_snmp_alert_managers``,\
        \ ``system_config``, ``system_time``,\n  ``system_reboot`` and ``system_factory_reset``\
        \ manage services and\n  general system settings, and reboot or factory reset\
        \ a device.\n* **Facts** - ``facts`` gathers facts from devices.\n\nThe ``ports``,\
        \ ``pdu``, ``services`` and ``system`` areas are split into\nsmaller, focused\
        \ modules based on behaviour (for example configuration,\nstatus and control)\
        \ rather than a single module per area.\n"
