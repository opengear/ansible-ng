---
# Integration Tests (PR)
#
# Runs module tests against physical devices when ready for review.
# Requires manual approval via the integration-tests environment for all PRs.

name: Integration Tests (PR)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_ref:
        description: 'Ref to test — e.g. refs/pull/123/head for a fork PR, or leave empty for current branch'
        required: false
        default: ''

# Cancel a run when the same PR gets new commits.
# workflow_dispatch runs get their own unique group via run_id and are not cancelled.
concurrency:
  group: integration-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Integration Tests
    runs-on: [self-hosted, ansible, integration-tests]
    # Only run on upstream repository, skip if not ready for review
    if: |
      github.repository == 'opengear/ansible-ng' &&
      github.event.pull_request.draft == false
    # All PRs require manual approval via the integration-tests environment
    environment: ${{ github.event_name == 'pull_request_target' && 'integration-tests' || '' }}
    # Use concurrency group shared with main post-merge integration-test job to serialise access
    concurrency:
      group: integration-tests-device
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: use provided ref, or the branch the dispatch was triggered on
          # pull_request_target: always use the PR head SHA (not the base branch default)
          ref: ${{ inputs.pr_ref || github.event.pull_request.head.sha || github.sha }}
          # Safe to opt in: the environment approval gate requires a human to review
          # the PR code before this step runs, mitigating the pwn-request risk.
          allow-unsafe-pr-checkout: true

      - name: Build inventory
        run: |
          cat > inventory.networking << EOF
          [opengear]
          test-om ansible_host=${{ secrets.OM2200_DEVICE_HOST }} \
                  ansible_user=${{ secrets.OM2200_DEVICE_USER }} \
                  ansible_password=${{ secrets.OM2200_DEVICE_PASSWORD }}
          [opengear:vars]
          ansible_connection=httpapi
          ansible_network_os=opengear.ng.http_api
          ansible_httpapi_use_ssl=true
          ansible_httpapi_validate_certs=false
          EOF

      - name: Run integration tests
        uses: ./.github/actions/integration-test
        with:
          python-version: "3.11"
          inventory-file: inventory.networking

      - name: Cleanup inventory
        if: always()
        shell: bash
        run: rm -f inventory.networking
