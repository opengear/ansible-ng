name: Version Check
description: Check that the version and changelog has been incremented before merge

runs:
  using: 'composite'
  steps:
      - name: Check if collection changed
        id: changed
        shell: bash
        run: |
          if git diff --name-only origin/main... | grep -qv '^.github/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check version incremented
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          OLD=$(git show origin/main:galaxy.yml \
            | grep '^version:' | awk '{print $2}' || true)
          NEW=$(grep '^version:' galaxy.yml \
            | awk '{print $2}')

          echo "Previous version: $OLD"
          echo "New version:      $NEW"

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$NEW" = "" ]; then
            echo "::error::opengear.ng does not have version in galaxy.yml."
            exit 1
          fi

          if ! [[ "$NEW" =~ $semver_re ]]; then
            echo "::error::galaxy.yml version '$NEW' is not valid semver (expected MAJOR.MINOR.PATCH)."
            exit 1
          fi

          if [ "$OLD" = "" ]; then
            echo "::warning::opengear.ng does not have version in main branch - skipping increase check."
            exit 0
          fi

          if ! [[ "$OLD" =~ $semver_re ]]; then
            echo "::error::main's galaxy.yml version '$OLD' is not valid semver (expected MAJOR.MINOR.PATCH)."
            exit 1
          fi

          IFS='.' read -r old_major old_minor old_patch <<< "$OLD"
          IFS='.' read -r new_major new_minor new_patch <<< "$NEW"

          increased=false
          if [ "$new_major" -gt "$old_major" ]; then
            increased=true
          elif [ "$new_major" -eq "$old_major" ] && [ "$new_minor" -gt "$old_minor" ]; then
            increased=true
          elif [ "$new_major" -eq "$old_major" ] && [ "$new_minor" -eq "$old_minor" ] && [ "$new_patch" -gt "$old_patch" ]; then
            increased=true
          fi

          if [ "$increased" != "true" ]; then
            echo "::error::galaxy.yml version must be increased from main ($OLD -> $NEW is not an increase)."
            exit 1
          fi
